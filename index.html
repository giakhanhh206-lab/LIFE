<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuộc Đời Từng Ngày</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗓️%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#e8edf0;--card:#fbfcfc;--ink:#1d2a33;--mute:#62727d;--line:#cbd5db;--acc:#1f5f8b;--gold:#a87700;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12181d;--card:#1a232a;--ink:#e4ecf0;--mute:#8a9ba6;--line:#2c3a44;--acc:#6db3e0;--gold:#e3b341;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1,.big{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif}
h1{font-size:2rem;margin:.4em 0 .2em;line-height:1.15}
p{margin:.4em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600;text-align:center}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:8px 0}
.top{display:flex;gap:14px;align-items:center}
.cal{border:2px solid var(--ink);border-radius:8px;min-width:96px;text-align:center;overflow:hidden}
.cal i{display:block;background:var(--acc);color:var(--bg);font-style:normal;font-size:.8rem;padding:2px}
.cal b{display:block;font-size:2rem;line-height:1.3}
.big{font-size:1.5rem;font-weight:700}
.mute{color:var(--mute);font-size:.9rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.bar span{display:block;height:100%;background:var(--acc);transition:width .25s}
.row{display:flex;justify-content:space-between;font-size:.9rem}
.money{margin-top:12px;font-weight:600;color:var(--gold)}
.days{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.days button{padding:6px 12px;text-align:center}
.days .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#log{max-height:260px;overflow:auto;font-size:.92rem;padding-left:0;list-style:none;margin:0}
#log li{padding:5px 0;border-bottom:1px solid var(--line)}
#log li:first-child{font-weight:600}
#log small{color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:440px;width:100%;margin:0}
.ov button{display:block;width:100%;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="start">
  <h1>Cuộc Đời Từng Ngày</h1>
  <p class="mute">Bạn bắt đầu từ năm 6 tuổi. Mỗi ngày bạn chọn một việc để làm. Thỉnh thoảng cuộc sống sẽ đặt ra cho bạn một lựa chọn. Hãy sống sao cho đáng nhất.</p>
  <div class="card">
    <label for="name">Tên nhân vật</label>
    <input id="name" maxlength="24" placeholder="Ví dụ: Minh Anh">
    <button class="pri" id="go" style="width:100%">Bắt đầu cuộc đời</button>
    <button id="cont" style="width:100%;margin-top:8px" hidden>Tiếp tục cuộc đời đã lưu</button>
  </div>
</section>

<section id="game" hidden>
  <div class="card">
    <div class="top">
      <div class="cal"><i>Ngày</i><b id="d">1</b></div>
      <div><div class="big" id="nm"></div><div id="ag"></div><div class="mute" id="st"></div></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="money" id="mo"></div>
  </div>
  <div class="card">
    <div class="days"><span class="mute">Sống liên tục:</span>
      <button data-n="1" class="on">1 ngày</button><button data-n="7">7 ngày</button><button data-n="30">30 ngày</button></div>
    <div class="acts" id="acts"></div>
    <p class="mute">Việc bạn chọn sẽ lặp lại mỗi ngày. Khi có sự kiện xảy ra, thời gian sẽ dừng lại.</p>
  </div>
  <div class="card"><ul id="log"></ul></div>
  <button id="reset" class="mute">Bỏ cuộc đời này và chơi lại</button>
</section>
</main>
<div class="ov" id="ov" hidden><div class="card" id="ovc"></div></div>

<script>
const $=s=>document.querySelector(s),KEY="cuoc-doi-tung-ngay-v1";
const clamp=v=>Math.max(0,Math.min(100,v)),rnd=Math.random;
const JOBS=["Thực tập sinh","Nhân viên","Chuyên viên","Trưởng nhóm","Trưởng phòng","Giám đốc"];
const STATS=[["hp","Sức khỏe"],["hap","Hạnh phúc"],["int","Trí tuệ"],["rel","Quan hệ"]];
let S=null,N=1;

const age=()=>Math.floor(S.day/365);
const stage=()=>age()<18?0:age()<60?1:2;
const fmt=k=>{const a=Math.abs(k),s=a>=1e6?(a/1e6).toFixed(1)+" tỷ":a>=1e3?(a/1e3).toFixed(1).replace(/\.0$/,"")+" triệu":Math.round(a)+" nghìn";return(k<0?"-":"")+s+" ₫"};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const wipe=()=>{try{localStorage.removeItem(KEY)}catch(e){}};
const log=t=>{S.log.unshift([age(),S.day,t]);S.log.length=Math.min(S.log.length,60)};
const fx=o=>{for(const k in o){if(k=="money"){if(age()>=18)S.money+=o.money}else S[k]=clamp(S[k]+o[k])}};
const ch=(p,y,n)=>rnd()<p?y:n;

function acts(){const s=stage();return[
 s==1?["💼","Đi làm",{money:250+S.job*150,hap:-.3,hp:-.15,int:.05,w:1}]:s==2?["🌱","Làm vườn",{hp:.2,hap:.5}]:["📚","Học bài",{int:.5,hap:-.3,hp:-.05}],
 s==1?["📖","Học thêm",{int:.5,hap:-.2,money:-30}]:s==0?["🎮","Vui chơi",{hap:.8,rel:.2,int:-.05}]:["📕","Đọc sách",{int:.2,hap:.3}],
 ["🏃","Tập thể thao",{hp:.6,hap:.3}],
 ["🤝","Gặp bạn bè",{rel:.7,hap:.4,money:-100}],
 ["😴","Nghỉ ngơi",{hp:.4,hap:.3}]]}

const EV=[
{a:[6,17],t:"Bạn bè rủ bạn trốn học đi chơi.",o:[["Đi chơi",()=>{fx({hap:8,int:-3,rel:5});return"Vui thật, nhưng bài vở bị bỏ lỡ."}],["Ở lại lớp",()=>{fx({int:2,rel:-2});return"Bạn học được thêm một chút, và hơi lẻ loi."}]]},
{a:[10,17],t:"Trường tổ chức kỳ thi học sinh giỏi.",o:[["Tham gia",()=>ch(.5,(fx({int:6,hap:6}),"Bạn đạt giải! Ai cũng chúc mừng."),(fx({int:2,hap:-4}),"Bạn trượt, nhưng học được nhiều điều."))],["Bỏ qua",()=>{fx({hap:2});return"Bạn dành ngày đó để nghỉ ngơi."}]]},
{a:[0,120],t:"Bạn bị cảm cúm nặng.",o:[["Đi khám",()=>{fx({money:-300,hp:-1});return"Bạn khỏe lại nhanh."}],["Tự chịu",()=>{fx({hp:-8,hap:-3});return"Mất vài ngày mới hết mệt."}]]},
{a:[10,120],t:"Bạn nhặt được một chiếc ví có ít tiền và giấy tờ.",o:[["Trả lại chủ",()=>{fx({hap:5,rel:3});return"Người mất ví cảm ơn bạn rối rít."}],["Giữ lại",()=>{fx({money:2000,hap:-3});return"Bạn có thêm tiền, và một chút áy náy."}]]},
{a:[15,28],t:"Bạn phải lòng một người. Họ cũng thường nhìn bạn.",o:[["Tỏ tình",()=>ch(.5,(fx({rel:10,hap:12}),"Họ đồng ý! Trái tim bạn rộn ràng."),(fx({hap:-8}),"Họ từ chối nhẹ nhàng. Bạn buồn mất mấy hôm."))],["Giữ trong lòng",()=>{fx({hap:-2});return"Bạn tự hỏi nếu ngày đó mình dám thì sao."}]]},
{a:[22,55],t:"Sếp giao bạn một dự án lớn và nhiều rủi ro.",o:[["Nhận",()=>ch(.55,(fx({money:5000,hap:8,int:2}),"Dự án thành công, bạn được thưởng lớn."),(fx({hap:-6,hp:-3}),"Dự án gặp trục trặc. Bạn kiệt sức."))],["Từ chối",()=>{fx({hap:2});return"Bạn giữ nhịp sống ổn định."}]]},
{a:[20,65],t:"Một người bạn rủ bạn góp 5 triệu đồng đầu tư.",o:[["Góp vốn",()=>ch(.45,(fx({money:7000,hap:5}),"Khoản đầu tư sinh lời. Bạn lãi 7 triệu."),(fx({money:-5000,hap:-6}),"Khoản đầu tư thua lỗ. Bạn mất 5 triệu."))],["Từ chối",()=>{return"Bạn chọn giữ tiền trong túi."}]]},
{a:[18,80],t:"Lớp cũ tổ chức buổi họp mặt.",o:[["Đi họp lớp",()=>{fx({money:-500,rel:8,hap:5});return"Cả lớp cười suốt buổi tối."}],["Không đi",()=>{fx({rel:-2});return"Bạn ở nhà. Hơi tiếc một chút."}]]},
{a:[8,90],t:"Một chú chó con lạc đứng run trước cửa nhà bạn.",o:[["Nhận nuôi",()=>{fx({money:-200,hap:8,rel:2});return"Từ hôm nay nhà bạn có thêm một thành viên."}],["Đưa đến trạm cứu hộ",()=>{fx({hap:2});return"Bạn hy vọng nó sẽ sớm có nhà."}]]},
{a:[25,40],u:"baby",t:"Bạn sắp có em bé!",o:[["Đón nhận niềm vui",()=>{fx({hap:15,rel:8,money:-2000});return"Em bé chào đời khỏe mạnh. Cuộc sống bận rộn và ngọt ngào hơn."}]]},
{a:[22,58],t:"Công ty cắt giảm nhân sự, bạn mất việc.",o:[["Xin việc mới",()=>{S.job=Math.max(1,S.job-1);fx({hap:-6});return"Sau vài tuần bạn có việc mới, với vị trí thấp hơn."}],["Khởi nghiệp",()=>ch(.4,(fx({money:10000,hap:10}),"Việc kinh doanh thành công ngoài mong đợi."),(fx({money:-6000,hap:-8}),"Việc kinh doanh thất bại. Bạn mất một khoản tiền lớn."))]]},
{a:[30,60],t:"Cha mẹ bạn đã già và cần người chăm sóc.",o:[["Tự dành thời gian chăm",()=>{fx({rel:6,hap:2,hp:-2});return"Bạn mệt hơn, nhưng gia đình gần nhau hơn."}],["Thuê người chăm",()=>{fx({money:-3000});return"Bạn lo được chi phí và vẫn thường xuyên ghé thăm."}]]},
{a:[40,100],t:"Đến kỳ khám sức khỏe định kỳ.",o:[["Đi khám",()=>{fx({money:-800,hp:6});return"Bác sĩ phát hiện sớm vài vấn đề nhỏ."}],["Bỏ qua",()=>{fx({hp:-2});return"Bạn tự nhủ mình vẫn khỏe."}]]},
{a:[18,100],t:"Bạn thấy một sạp bán vé số ven đường.",o:[["Mua một tờ",()=>ch(.03,(fx({money:50000,hap:20}),"Bạn trúng 50 triệu đồng! Thật không tin nổi."),(fx({money:-10}),"Không trúng. Cũng chẳng sao."))],["Đi tiếp",()=>"Bạn bước qua sạp vé số."]]}
];

function endGame(why){
  const a=age(),sc=Math.round(a*3+S.hap+S.int+S.rel+Math.max(0,Math.min(S.money,1e6))/5000);
  log("Bạn qua đời. "+why);wipe();
  show(`<h1 style="font-size:1.6rem">Cuộc đời khép lại</h1><p>${esc(S.name)} qua đời ở tuổi <b>${a}</b> sau ${S.day.toLocaleString("vi")} ngày. ${why}</p>
  <p class="mute">Cuối đời: hạnh phúc ${Math.round(S.hap)}, trí tuệ ${Math.round(S.int)}, quan hệ ${Math.round(S.rel)}, tài sản ${fmt(S.money)}${S.job>0?", chức vụ cao nhất: "+JOBS[S.best-1]:""}.</p>
  <p class="big">Điểm cuộc đời: ${sc}</p><button class="pri" onclick="location.reload()">Chơi lại</button>`);
  S.dead=1;
}
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(h){$("#ovc").innerHTML=h;$("#ov").hidden=false}

function step(e){
  S.day++;const a=age(),ad=a>=18;
  if(S.day%365==0){log("🎂 Bạn tròn "+a+" tuổi.");
    if(a==18){S.job=1;S.best=1;S.money+=5000;log("🎓 Bạn trưởng thành và bắt đầu đi làm. Gia đình cho bạn 5 triệu đồng khởi nghiệp.")}
    if(a==60)log("🏖️ Bạn về hưu và bắt đầu nhận lương hưu.")}
  for(const k in e){if(k=="money"){if(ad)S.money+=e.money}else if(k=="w"){S.w++;
    if(S.w%120==0&&S.job<6&&S.int>=20+S.job*12){S.job++;S.best=Math.max(S.best,S.job);log("📈 Bạn được thăng chức: "+JOBS[S.job-1]+".")}}
    else S[k]=clamp(S[k]+e[k])}
  if(ad)S.money-=180;if(a>=60)S.money+=200;
  S.rel=clamp(S.rel-.06);
  if(S.money<0)S.hap=clamp(S.hap-.3);
  if(S.hp<30)S.hap=clamp(S.hap-.15);
  if(a>=40)S.hp=clamp(S.hp-(a-40)*.0012);
  if(S.hp<=0){endGame("Sức khỏe của bạn đã cạn kiệt.");return 2}
  if(a>=70&&rnd()<Math.pow(a-70,2)*4e-6||a>=105){endGame("Bạn ra đi nhẹ nhàng trong giấc ngủ.");return 2}
  if(rnd()<.1){const ok=EV.filter(v=>a>=v.a[0]&&a<=v.a[1]&&!(v.u&&S.done.includes(v.u)));
    if(ok.length){event(ok[Math.floor(rnd()*ok.length)]);return 1}}
  return 0}

function event(v){
  if(v.u)S.done.push(v.u);
  show(`<p class="mute">Ngày ${S.day.toLocaleString("vi")} - ${age()} tuổi</p><p class="big" style="font-size:1.2rem">${v.t}</p>`+v.o.map((o,i)=>`<button data-i="${i}">${o[0]}</button>`).join(""));
  $("#ovc").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;
    const r=v.o[b.dataset.i][1]();log(v.t+" "+v.o[b.dataset.i][0]+": "+r);
    show(`<p>${r}</p><button class="pri" id="ok">Tiếp tục</button>`);$("#ovc").onclick=null;
    $("#ok").onclick=()=>{$("#ov").hidden=true;if(S.hp<=0)endGame("Sức khỏe của bạn đã cạn kiệt.");render();save()}}}

function run(i){
  const e=acts()[i][2];
  for(let k=0;k<N;k++){if(step(e))break}
  render();save()}

function render(){
  if(S.dead)return;
  $("#d").textContent=S.day.toLocaleString("vi");$("#nm").textContent=S.name;
  $("#ag").textContent=age()+" tuổi";
  $("#st").textContent=["Thời đi học","Tuổi lao động"+(S.job?" - "+JOBS[S.job-1]:""),"Tuổi nghỉ hưu"][stage()];
  $("#stats").innerHTML=STATS.map(([k,n])=>`<div><div class="row"><span>${n}</span><span>${Math.round(S[k])}</span></div><div class="bar"><span style="width:${S[k]}%"></span></div></div>`).join("");
  $("#mo").textContent=age()>=18?"Tài sản: "+fmt(S.money):"Bạn chưa tự kiếm tiền";
  $("#acts").innerHTML=acts().map((a,i)=>`<button data-a="${i}">${a[0]} ${a[1]}</button>`).join("");
  $("#log").innerHTML=S.log.slice(0,30).map(l=>`<li><small>${l[0]} tuổi, ngày ${l[1].toLocaleString("vi")}</small><br>${esc(l[2])}</li>`).join("")}

function begin(s){S=s;$("#start").hidden=true;$("#game").hidden=false;render()}
$("#go").onclick=()=>{const n=$("#name").value.trim()||"Người vô danh";
  const s={name:n,day:6*365,hp:80,hap:70,int:30,rel:50,money:0,job:0,best:0,w:0,done:[],log:[]};
  begin(s);log("🌱 Bạn "+n+" bước vào cuộc đời ở tuổi 6.");render();save()};
$("#cont").onclick=()=>begin(load());
$("#acts").onclick=e=>{const b=e.target.closest("button[data-a]");if(b)run(+b.dataset.a)};
document.querySelector(".days").onclick=e=>{const b=e.target.closest("button");if(!b)return;N=+b.dataset.n;
  document.querySelectorAll(".days button").forEach(x=>x.classList.toggle("on",x==b))};
$("#reset").onclick=()=>{if(confirm("Bạn chắc chắn muốn bỏ cuộc đời này và bắt đầu lại?")){wipe();location.reload()}};
if(load())$("#cont").hidden=false;
</script>
</body>
</html>
