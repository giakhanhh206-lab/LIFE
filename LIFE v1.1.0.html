<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#e9edf1;--card:#fff;--ink:#1c232b;--mute:#66727e;--line:#d5dce2;--head:#1f2a37;--green:#2fa84f;--hap:#f2b705;--hp:#34b653;--int:#3b82f6;--look:#ec5f9a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#1a222a;--ink:#e6edf2;--mute:#8b99a5;--line:#2b3641;--head:#0a0f13;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--int);outline-offset:2px}
button.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.ch{display:block;width:100%;margin-top:8px;text-align:left}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:8px 0}
#intro{width:100%;max-width:480px;padding:64px 24px}
#intro h1{font-size:4.5rem;letter-spacing:.1em;margin:0;color:var(--green);line-height:1}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
header{background:var(--head);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:1.15rem}header small{display:block;opacity:.75}
.money{font-weight:700;font-size:1.1rem}
#feed{flex:1;overflow:auto;padding:12px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.blk h3{margin:0 0 4px;font-size:1rem}.blk p{margin:3px 0}
#stats{background:var(--card);border-top:1px solid var(--line);padding:8px 16px}
.st{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:3px 0}
.st span:first-child{width:76px}.st span:last-child{width:28px;text-align:right}
.st i{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.st b{display:block;height:100%;transition:width .3s}
nav{display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px}
nav button[data-t]{background:none;border:0;font-size:.75rem;text-align:center;color:var(--mute)}
nav button span{display:block;font-size:1.4rem}
#age{width:68px;height:68px;border-radius:50%;margin:-22px auto 0;font-size:.8rem;font-weight:700;background:var(--green);color:#fff;border:4px solid var(--card);line-height:1.1;padding:0}
#age span{display:block;font-size:1.7rem}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#shc{width:100%;max-width:480px;max-height:80vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:12px 16px 20px}
#shc h2{margin:0;font-size:1.2rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sub{color:var(--mute);font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}.bar b{display:block;height:100%;background:var(--int)}
.vb{display:block;margin:0 0 0 auto;padding:2px 0;background:none;border:0;color:inherit;opacity:.7;font-size:.75rem}
.ver{margin-top:16px;padding:4px 0;background:none;border:0;color:var(--mute);font-size:.8rem}
</style>
</head>
<body>
<section id="intro">
  <h1>LIFE</h1>
  <p>Be born. Age up one year at a time. Make choices that shape who you become.</p>
  <input id="nm0" maxlength="24" placeholder="Your name (blank for random)">
  <button class="pri ch" id="go">Be born</button>
  <button class="ch" id="cont" hidden>Continue your life</button>
  <button class="ver" id="verI"></button>
</section>

<div id="app" hidden>
  <header><div><b id="nm"></b><small id="sb"></small></div><div><div class="money" id="mo"></div><button class="vb" id="vb"></button></div></header>
  <div id="feed"></div>
  <div id="stats"></div>
  <nav>
    <button data-t="job"><span>💼</span>Occupation</button>
    <button data-t="as"><span>🏠</span>Assets</button>
    <button id="age"><span>+</span>Age</button>
    <button data-t="rel"><span>❤️</span>Relationships</button>
    <button data-t="act"><span>🎯</span>Activities</button>
  </nav>
</div>
<div id="sh" hidden><div id="shc"></div></div>

<script>
const $=s=>document.querySelector(s),KEY="life-game-v1";
const VER="1.1.0",LOG=[["1.1.0",["Added version numbers and this changelog. Tap the version to open it.","Saves now store their version and upgrade automatically.","New asset: Stocks. Risky, and the value changes every year.","New: give gifts to loved ones for $100.","New: adopt a cat. Pets of both kinds now age and pass away.","Five new life events."]],["1.0.0",["First release: aging, school, college, jobs, relationships, assets, activities, crime and prison."]]];
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],cl=v=>Math.max(0,Math.min(100,v));
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const FN=["Alex","Maya","Liam","Sofia","Noah","Emma","Lucas","Olivia","Ethan","Ava","Mason","Mia","Leo","Zoe","Jack","Nora","Owen","Ella"],
LN=["Smith","Johnson","Brown","Garcia","Miller","Davis","Wilson","Moore","Clark","Lewis"],
CITY=["New York","London","Toronto","Sydney","Chicago","Dublin","Seattle","Austin"],PET=["Buddy","Luna","Max","Daisy"];
const ST=[["hap","Happiness"],["hp","Health"],["int","Smarts"],["look","Looks"]];
// [title, min age, min smarts, needs degree, salary]
const JOBS=[["Cashier",16,0,0,22000],["Waiter",16,0,0,26000],["Office Clerk",18,35,0,38000],["Electrician",19,40,0,52000],["Teacher",22,45,1,55000],["Nurse",22,50,1,70000],["Software Engineer",22,65,1,115000],["Lawyer",24,72,1,140000],["Doctor",26,80,1,210000],["Chef",18,40,0,48000],["Police Officer",21,45,0,62000],["Engineer",22,68,1,105000],["Pilot",24,70,1,150000]];
const AS=[["Used car",12000,"A reliable ride.",{hap:5}],["Luxury watch",9000,"Turns heads.",{look:4}],["Small house",180000,"No more rent. Value grows.",{hap:8}],["Sports car",85000,"Fast and flashy.",{hap:10,look:3}],["Stocks",10000,"Risky. Value changes every year.",{}]];

let S=null,H=[],CL=1;
const save=()=>{if(S.dead)return;S.v=VER;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{const o=JSON.parse(localStorage.getItem(KEY));if(o){o.used=o.used||{};o.v=VER}return o}catch(e){return null}};
const wipe=()=>{try{localStorage.removeItem(KEY)}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=t=>{let b=S.log[S.log.length-1];if(!b||b.age!=S.age){b={age:S.age,lines:[]};S.log.push(b);if(S.log.length>40)S.log.shift()}b.lines.push(t)};
const fx=o=>{for(const k in o){if(k=="money"){if(S.age>=18)S.money+=o.money}else S[k]=cl(S[k]+o[k])}};
const ch=(p,y,n)=>Math.random()<p?y():n();
const nw=()=>S.money+S.assets.reduce((a,x)=>a+x.v,0);
const jail=(y,w)=>{S.jail=y;S.rec=1;S.job=null;S.col=0;fx({hap:-10});return`You were caught for ${w} and sentenced to ${y} years in prison.`};

const ACT=[
["Gym",6,0,"Boost Health and Looks.",()=>(fx({hp:R(2,5),look:R(1,3)}),"You worked out at the gym.")],
["Library",5,0,"Boost your Smarts.",()=>(fx({int:R(2,5)}),"You read at the library.")],
["Meditate",10,0,"Boost Happiness.",()=>(fx({hap:R(2,6)}),"You meditated and felt calmer.")],
["Doctor",1,150,"Get a checkup.",()=>(fx({money:-150,hp:R(4,9)}),"You visited the doctor.")],
["Vacation",18,3000,"Big Happiness boost.",()=>(fx({money:-3000,hap:R(8,16)}),"You went on a relaxing vacation.")],
["Dating app",18,0,"Try to meet someone.",()=>{if(S.rel.some(p=>p.r=="Partner"||p.r=="Spouse"))return"You already have a partner.";
  return ch(.55,()=>{const p={n:P(FN)+" "+P(LN),r:"Partner",a:Math.max(18,S.age+R(-4,4)),c:60};S.rel.push(p);fx({hap:8});return"You matched with "+p.n+" and started dating."},()=>(fx({hap:-2}),"You didn't find a match this year."))}],
["Casino",21,1000,"Bet $1,000. 45% chance to double it.",()=>ch(.45,()=>(fx({money:1000,hap:6}),"You won $1,000 at the casino!"),()=>(fx({money:-1000,hap:-5}),"You lost $1,000 at the casino."))]];

const EV=[
{a:[6,17],t:"A bully at school keeps picking on you.",o:[["Fight back",()=>ch(.5,()=>(fx({hap:6,hp:-3}),"You stood up for yourself and the bully backed off."),()=>(fx({hap:-6,hp:-8}),"You lost the fight and got hurt."))],["Tell a teacher",()=>(fx({hap:2}),"The teacher stepped in. Things got a little better.")],["Ignore it",()=>(fx({hap:-6}),"The bullying continued. It hurt.")]]},
{a:[10,17],t:"A friend offers to let you copy their test answers.",o:[["Copy",()=>ch(.4,()=>(fx({int:-3,hap:-6}),"You got caught and punished."),()=>(fx({hap:3}),"You got away with it."))],["Say no",()=>(fx({int:2,hap:2}),"You studied on your own.")]]},
{a:[14,30],t:"A classmate invites you to a big party.",o:[["Go",()=>ch(.25,()=>(fx({hap:-4,hp:-6}),"Things got wild. You woke up feeling terrible."),()=>(fx({hap:8}),"You had a great time and met new people."))],["Stay home",()=>(fx({hap:-1}),"You had a quiet night in.")]]},
{a:[10,100],t:"You found a wallet with cash inside.",o:[["Return it",()=>(fx({hap:5}),"The owner thanked you warmly.")],["Keep the cash",()=>(fx({money:500,hap:-3}),"You pocketed $500 and felt a little guilty.")]]},
{a:[1,100],t:"You came down with a nasty illness.",o:[["See a doctor",()=>(fx({money:-300,hp:-2}),"The doctor treated you and you recovered quickly.")],["Tough it out",()=>(fx({hp:-9,hap:-3}),"You were sick for weeks.")]]},
{a:[18,64],c:()=>S.job,t:"Your boss asks you to work late all week.",o:[["Work late",()=>(fx({money:2500,hp:-3,hap:-4}),"You earned a $2,500 bonus but you're exhausted.")],["Decline",()=>ch(.3,()=>(S.job.sal=Math.round(S.job.sal*.95),"Your boss was annoyed and trimmed your pay."),()=>(fx({hap:3}),"Your boss understood."))]]},
{a:[20,65],t:"A friend pitches you a hot investment for $5,000.",o:[["Invest",()=>ch(.45,()=>(fx({money:8000,hap:5}),"It paid off. You made $8,000."),()=>(fx({money:-5000,hap:-6}),"The investment collapsed. You lost $5,000."))],["Pass",()=>"You kept your savings safe."]]},
{a:[8,90],c:()=>!S.rel.some(p=>p.r=="Dog"),t:"A stray dog follows you home.",o:[["Adopt it",()=>{const p={n:P(PET),r:"Dog",a:0,c:80};S.rel.push(p);fx({hap:8,money:-200});return"You adopted a dog and named it "+p.n+"."}],["Take it to a shelter",()=>(fx({hap:2}),"You hope it finds a good home.")]]},
{a:[22,60],c:()=>S.rel.some(p=>p.r=="Partner"&&p.c>55),t:"You've been dating for a while. Time to propose?",o:[["Propose",()=>{const p=S.rel.find(x=>x.r=="Partner");return ch(.8,()=>{p.r="Spouse";p.c=cl(p.c+15);fx({hap:12,money:-8000});return"They said yes! You married "+p.n+"."},()=>(fx({hap:-8}),p.n+" said no. It hurts."))}],["Not yet",()=>"You decided to wait."]]},
{a:[24,40],c:()=>S.rel.some(p=>p.r=="Spouse")&&S.rel.filter(p=>p.r=="Child").length<3,t:"Your spouse is expecting a baby!",o:[["Welcome the baby",()=>{const c={n:P(FN),r:"Child",a:0,c:85};S.rel.push(c);fx({hap:12});return"You welcomed a baby named "+c.n+"."}]]},
{a:[17,90],t:"You were in a car accident.",o:[["Call for help",()=>(fx({hp:-8,money:-2000}),"You got medical care. It cost $2,000.")],["Drive away",()=>ch(.4,()=>(fx({hp:-8,hap:-10,money:-6000}),"You were caught and fined $6,000."),()=>(fx({hp:-10,hap:-3}),"You got away, but you're badly bruised."))]]},
{a:[18,100],t:"You see a lottery ticket stand.",o:[["Buy a ticket ($10)",()=>ch(.03,()=>(fx({money:50000,hap:20}),"You won $50,000!"),()=>(fx({money:-10}),"Not a winner."))],["Walk on",()=>"You kept walking."]]},
{a:[40,50],u:"mid",t:"You're having a midlife crisis.",o:[["Splurge ($15,000)",()=>(fx({money:-15000,hap:15,look:3}),"You spent big and felt young again.")],["Push through",()=>(fx({hap:-5}),"It was a rough year.")]]},
{a:[20,70],t:"A friend asks to borrow $2,000.",o:[["Lend it",()=>ch(.5,()=>(fx({hap:4}),"They paid you back and thanked you."),()=>(fx({money:-2000,hap:-4}),"They never paid you back."))],["Say no",()=>(fx({hap:-1}),"You kept your money.")]]},
{a:[22,60],c:()=>S.job,t:"Your manager offers you a promotion with longer hours.",o:[["Accept",()=>(S.job.sal=Math.round(S.job.sal*1.2),fx({hp:-3,hap:-2}),"Your salary is now "+money(S.job.sal)+", but the hours are brutal.")],["Decline",()=>(fx({hap:2}),"You kept your work-life balance.")]]},
{a:[8,17],t:"Your school is holding a talent show.",o:[["Enter",()=>ch(.5,()=>(fx({hap:8,look:2}),"You wowed the crowd!"),()=>(fx({hap:-5}),"You froze on stage."))],["Skip it",()=>"You watched from the audience."]]},
{a:[30,90],t:"A stranger calls claiming you owe back taxes.",o:[["Pay them $3,000",()=>(fx({money:-3000,hap:-6}),"It was a scam. You lost $3,000.")],["Hang up",()=>(fx({hap:2}),"You spotted the scam and hung up.")]]},
{a:[18,90],c:()=>S.assets.some(a=>a.n=="Small house"),t:"A storm damaged your house.",o:[["Repair it ($4,000)",()=>(fx({money:-4000,hap:-2}),"Your house is as good as new.")],["Patch it yourself",()=>(fx({hp:-4,hap:-4}),"You got hurt on the roof and the repair is shaky.")]]},
{a:[14,40],t:"A video of you goes viral online.",o:[["Embrace the fame",()=>ch(.6,()=>(fx({hap:10}),"People loved it. You're briefly famous!"),()=>(fx({hap:-10}),"People mocked you online."))],["Delete it",()=>(fx({hap:-2}),"You deleted it and moved on.")]]},
{a:[45,100],t:"You feel sudden chest pain.",o:[["Go to the ER ($1,500)",()=>(fx({money:-1500,hp:2}),"Doctors caught a heart problem early.")],["Ignore it",()=>ch(.2,()=>(fx({hp:-25,hap:-8}),"It was a heart attack. You barely survived."),()=>"The pain passed on its own.")]]},
{a:[18,70],c:()=>S.rel.some(p=>p.r=="Partner"||p.r=="Spouse"),t:"You catch your partner texting someone in secret.",o:[["Confront them",()=>{const p=S.rel.find(x=>x.r=="Partner"||x.r=="Spouse");return ch(.5,()=>{p.c=cl(p.c+10);return p.n+" apologized and explained. Trust is restored."},()=>{S.rel=S.rel.filter(x=>x!==p);fx({hap:-15});return p.n+" admitted to cheating and left you."})}],["Let it go",()=>(fx({hap:-4}),"You swallowed your doubts.")]]}
];
ACT.push(
["Side gig",18,0,"Earn some extra cash.",()=>{const g=R(1500,5000);fx({money:g,hp:-1});return"Your side gig paid "+money(g)+"."}],
["Volunteer",12,0,"Help your community.",()=>(fx({hap:R(3,7)}),"You volunteered and felt fulfilled.")],
["Therapy",18,200,"Talk it out. Boost Happiness.",()=>(fx({money:-200,hap:R(5,10)}),"Therapy helped you feel lighter.")],
["Plastic surgery",18,8000,"Boost Looks. Small risk.",()=>ch(.9,()=>(fx({money:-8000,look:R(8,15)}),"The surgery went well. You look great."),()=>(fx({money:-8000,look:-6,hp:-8,hap:-8}),"The surgery went badly."))],
["Shoplift",18,0,"Risky. You might get caught.",()=>ch(.75,()=>{const g=R(100,400);fx({money:g,hap:2});return"You stole goods worth "+money(g)+" and got away."},()=>(fx({money:-500,hap:-6}),"You were caught shoplifting and fined $500."))],
["Burglary",18,0,"Break into a house for big cash.",()=>ch(.55,()=>{const g=R(2000,8000);fx({money:g,hap:3});return"You stole "+money(g)+" and escaped."},()=>jail(R(2,4),"burglary"))],
["Rob a bank",21,0,"Huge payout, huge risk.",()=>ch(.25,()=>{const g=R(30000,90000);fx({money:g,hap:10});return"You robbed a bank and got away with "+money(g)+"!"},()=>jail(R(6,12),"bank robbery"))],
["Escape prison",16,0,"15% chance. If you fail, you get 2 more years.",()=>ch(.15,()=>{S.jail=0;S.rec=1;fx({hap:5});return"You escaped from prison!"},()=>{S.jail+=2;fx({hap:-8});return"Your escape failed. Two years added to your sentence."}),"j"]
);

const stk=()=>S.assets.find(x=>x.n=="Stocks");
EV.push(
{a:[8,90],c:()=>!S.rel.some(p=>p.r=="Cat"),t:"A friendly cat keeps visiting your doorstep.",o:[["Adopt it",()=>{const p={n:P(PET),r:"Cat",a:0,c:80};S.rel.push(p);fx({hap:6,money:-100});return"You adopted a cat named "+p.n+"."}],["Leave out some milk",()=>(fx({hap:2}),"The cat purred and wandered off.")]]},
{a:[18,60],c:()=>S.job,t:"A rival company offers you a job with better pay.",o:[["Take it",()=>ch(.7,()=>(S.job.sal=Math.round(S.job.sal*1.15),fx({hap:4}),"You switched jobs. Your salary is now "+money(S.job.sal)+"."),()=>(fx({hap:-5}),"The offer fell through and your boss noticed."))],["Stay put",()=>(fx({hap:1}),"You stayed loyal to your employer.")]]},
{a:[16,90],t:"A neighbor invites you to a weekly book club.",o:[["Join",()=>(fx({int:R(2,4),hap:R(1,4)}),"You made friends and learned a lot.")],["Decline",()=>"You had a quiet evening instead."]]},
{a:[22,80],c:stk,t:"The stock market is in turmoil.",o:[["Sell everything",()=>{const a=stk();S.money+=a.v;S.assets=S.assets.filter(x=>x!==a);return"You cashed out "+money(a.v)+" to play it safe."}],["Hold",()=>ch(.5,()=>{const a=stk();a.v=Math.round(a.v*1.25);return"The market rebounded. Your stocks are now worth "+money(a.v)+"."},()=>{const a=stk();a.v=Math.round(a.v*.7);fx({hap:-4});return"Stocks fell further. They are now worth "+money(a.v)+"."})]]},
{a:[30,90],c:()=>S.rel.some(p=>p.r=="Friend"),t:"An old friend invites you to dinner.",o:[["Go",()=>{const p=P(S.rel.filter(x=>x.r=="Friend"));p.c=cl(p.c+20);fx({hap:5,money:-80});return"You caught up with "+p.n+" over dinner."}],["Cancel",()=>(fx({hap:-2}),"You stayed in.")]]}
);
function sheet(t,h,x=1){CL=x;$("#sh").hidden=false;$("#shc").innerHTML=`<div class="row" style="border:0"><h2>${t}</h2>${x?"<button data-x>Close</button>":""}</div>`+h}
const close=()=>{$("#sh").hidden=true};
$("#sh").onclick=e=>{const b=e.target.closest("button[data-h]");if(b&&!b.disabled){H[b.dataset.h]();return}
  if(CL&&(e.target.id=="sh"||e.target.closest("[data-x]")))close()};
const row=(t,s,b,fn,dis)=>{if(b)H.push(fn);return`<div class="row"><div><b>${t}</b><div class="sub">${s}</div></div>${b?`<button data-h="${H.length-1}"${dis?" disabled":""}>${b}</button>`:""}</div>`};

const gift=(p,i)=>{H.push(()=>{S.used["g"+i]=1;S.money-=100;p.c=cl(p.c+R(8,14));fx({hap:R(1,3)});L("You gave "+p.n+" a gift.");render();panel("rel")});return`<button data-h="${H.length-1}"${S.used["g"+i]||S.age<18||S.money<100?" disabled":""}>Gift $100</button>`};
function about(){H=[];sheet("LIFE v"+VER,LOG.map(([v,l])=>`<div class="row"><div><b>Version ${v}</b>${l.map(x=>`<div class="sub">- ${x}</div>`).join("")}</div></div>`).join(""))}
function panel(t){
  H=[];let h="",ti="",A=S.age;
  if(t=="job"){ti="Occupation";
    if(S.jail)h='<p class="sub">You are in prison and cannot work.</p>';
    else if(A<5)h='<p class="sub">You are too young for school or work.</p>';
    else{
      if(A<18)h+=row("School","You are in school.");
      if(S.col)h+=row("College","Year "+S.col+" of 4. $20,000 per year.");
      else if(A>=18&&A<=35&&!S.deg)h+=row("College","$20,000 per year for 4 years. No full-time work while enrolled.","Enroll",()=>{S.col=1;S.job=null;L("You enrolled in college.");render();panel("job")});
      if(S.job)h+=row(S.job.t,money(S.job.sal)+" per year","Quit",()=>{L("You quit your job: "+S.job.t+".");S.job=null;render();panel("job")});
      if(A>=16&&A<65&&!S.col)h+=JOBS.map((j,i)=>row(j[0],money(j[4])+"/yr. Needs age "+j[1]+"+, Smarts "+j[2]+"+"+(j[3]?", degree":""),"Apply",()=>{
        S.used["j"+i]=1;const c=Math.min(90,Math.max(20,50+(S.int-j[2])/2+S.look/10-(S.rec?25:0)));
        if(Math.random()*100<c){S.job={t:j[0],sal:j[4]};L("You got a new job: "+j[0]+" ("+money(j[4])+" per year).")}else L("Your application for "+j[0]+" was rejected.");
        render();panel("job")},A<j[1]||S.int<j[2]||(j[3]&&!S.deg)||S.used["j"+i]||(S.job&&S.job.t==j[0]))).join("");
      if(A>=65)h+=row("Retired","Pension: "+money(S.pension)+" per year");
    }}
  else if(t=="as"){ti="Assets";
    h=S.assets.map(a=>row(a.n,"Worth "+money(a.v),"Sell",()=>{S.money+=a.v;S.assets=S.assets.filter(x=>x!==a);L("You sold your "+a.n.toLowerCase()+" for "+money(a.v)+".");render();panel("as")})).join("");
    if(A<18)h+='<p class="sub">You can buy assets when you turn 18.</p>';
    else h+=AS.filter(a=>!S.assets.some(x=>x.n==a[0])).map(a=>row(a[0],a[2]+" "+money(a[1])+".","Buy",()=>{S.money-=a[1];S.assets.push({n:a[0],v:a[1]});fx(a[3]);L("You bought a "+a[0].toLowerCase()+" for "+money(a[1])+".");render();panel("as")},S.money<a[1])).join("");
    h+=`<p class="sub">Net worth: ${money(nw())}</p>`}
  else if(t=="rel"){ti="Relationships";
    h=S.rel.map((p,i)=>{H.push(()=>{S.used["r"+i]=1;p.c=cl(p.c+R(6,12));fx({hap:R(1,4)});L("You spent time with "+p.n+".");render();panel("rel")});
      return`<div class="row"><div style="flex:1"><b>${p.n}</b> <span class="sub">${p.r}, age ${p.a}</span><div class="bar"><b style="width:${p.c}%"></b></div></div><span style="display:flex;gap:6px"><button data-h="${H.length-1}"${S.used["r"+i]?" disabled":""}>Spend time</button>${gift(p,i)}</span></div>`}).join("")}
  else{ti="Activities";
    const jl=S.jail>0;h=ACT.filter(a=>A>=a[1]&&(jl?["Gym","Library","Meditate","Escape prison"].includes(a[0]):a[5]!="j")).map(a=>{const c=A>=18?a[2]:0;
      return row(a[0],a[3]+(c?" Costs "+money(c)+".":""),"Do it",()=>{S.used[a[0]]=1;L(a[4]());render();panel("act")},S.used[a[0]]||S.money<c)}).join("")}
  sheet(ti,h)}

function render(){
  $("#nm").textContent=S.name;
  $("#sb").textContent="Age "+S.age+" - "+(S.jail?"In prison":S.job?S.job.t:S.col?"College student":S.age<5?"Baby":S.age<18?"Student":S.age>=65?"Retired":"Unemployed");
  $("#mo").textContent=money(S.money);
  $("#feed").innerHTML=S.log.map(b=>`<div class="blk"><h3>${b.age?"Age "+b.age:"Newborn"}</h3>${b.lines.map(l=>`<p>${esc(l)}</p>`).join("")}</div>`).join("");
  $("#feed").scrollTop=1e9;
  $("#stats").innerHTML=ST.map(([k,n])=>`<div class="st"><span>${n}</span><i><b style="width:${S[k]}%;background:var(--${k})"></b></i><span>${Math.round(S[k])}</span></div>`).join("")}

function die(why){
  S.dead=1;L("You died. "+why);wipe();render();
  sheet("Rest in peace",`<p><b>${esc(S.name)}</b> died at age ${S.age}.</p><p class="sub">${why}</p><p>Net worth: <b>${money(nw())}</b><br>Children: ${S.rel.filter(p=>p.r=="Child").length}<br>Education: ${S.deg?"College graduate":"High school"}</p><button class="pri ch" onclick="location.reload()">Start a new life</button>`,0)}

function event(v){
  if(v.u)S.done.push(v.u);H=[];
  const b=v.o.map(o=>{H.push(()=>{const r=o[1]();L(v.t+" "+r);render();
    H=[()=>{close();S.hp<=0?die("Your health failed."):save()}];
    sheet("Age "+S.age,`<p>${r}</p><button class="pri ch" data-h="0">Continue</button>`,0)});
    return`<button class="ch" data-h="${H.length-1}">${o[0]}</button>`}).join("");
  sheet("Age "+S.age,`<p><b>${v.t}</b></p>`+b,0)}

function ageUp(){
  if(S.dead)return;
  S.age++;S.used={};const A=S.age;
  S.rel.forEach(p=>{p.a++;p.c=cl(p.c-R(2,5))});
  S.rel=S.rel.filter(p=>{
    if((p.r=="Mother"||p.r=="Father")&&p.a>65&&Math.random()<(p.a-65)*.012){const inh=R(5000,40000);fx({hap:-15,money:inh});L(`Your ${p.r.toLowerCase()} ${p.n} passed away at age ${p.a}.`+(A>=18?" You inherited "+money(inh)+".":""));return false}
    if((p.r=="Dog"||p.r=="Cat")&&p.a>11){fx({hap:-10});L(p.n+" the "+p.r.toLowerCase()+" passed away.");return false}
    if((p.r=="Partner"||p.r=="Friend")&&p.c<12){fx({hap:-6});L(p.r=="Partner"?p.n+" broke up with you.":"You lost touch with "+p.n+".");return false}
    return true});
  const m={5:"You started elementary school.",12:"You started middle school.",14:"You started high school.",18:"You graduated high school and became an adult."};
  if(m[A])L(m[A]);
  if(A==18){const g=R(500,3000);S.money+=g;L("You received "+money(g)+" in graduation gifts.")}
  if([6,12,15,19].includes(A)){const f={n:P(FN)+" "+P(LN),r:"Friend",a:A+R(-1,1),c:65};S.rel.push(f);L("You made a new friend: "+f.n+".")}
  if(A>=5&&A<18)S.int=cl(S.int+R(0,3));
  const J=S.jail>0;
  if(J){S.jail--;S.job=null;S.col=0;fx({hap:-R(2,5),hp:-R(0,2)});L(S.jail?"You spent another year in prison.":"You were released from prison.")}
  if(S.col){S.money-=20000;S.int=cl(S.int+R(1,3));if(S.col>=4){S.col=0;S.deg=1;L("You graduated from college!")}else{S.col++;L("You finished another year of college.")}}
  if(S.job){S.money+=S.job.sal;
    if(Math.random()<.18){S.job.sal=Math.round(S.job.sal*1.1);L("You got a raise! Your salary is now "+money(S.job.sal)+".")}
    else if(Math.random()<.04){L("You were laid off from your job: "+S.job.t+".");fx({hap:-8});S.job=null}}
  if(A==65){S.pension=Math.max(12000,S.job?S.job.sal*.4:0);if(S.job){L("You retired.");S.job=null}else L("You started receiving a pension.")}
  if(S.pension)S.money+=S.pension;
  if(A>=18&&!J){const house=S.assets.some(a=>a.n=="Small house");
    S.money-=(house?8000:18000)+S.rel.filter(p=>p.r=="Child"&&p.a<18).length*6000;
    if(S.money<0&&!S.col)fx({hap:-6})}
  S.assets.forEach(a=>{a.v=Math.round(a.v*(a.n=="Small house"?1.03:a.n=="Luxury watch"?1:a.n=="Stocks"?1+R(-18,22)/100:.88))});
  fx({hap:R(-4,3),hp:A>35?-R(0,Math.floor((A-35)/8)+1):R(0,1),look:A>30?-R(0,2):0});
  if(S.hp<=0)return die("Your health failed.");
  const q=A>=60?Math.pow(A-60,2)*.0004+(S.hp<25?.08:0):S.hp<10?.05:0;
  if(Math.random()<q||A>=110)return die(A>=70?"Natural causes.":"A sudden illness.");
  const ok=EV.filter(e=>A>=e.a[0]&&A<=e.a[1]&&(!e.c||e.c())&&!(e.u&&S.done.includes(e.u)));
  render();save();
  if(ok.length&&Math.random()<.7)event(P(ok))}

function start(){$("#intro").hidden=true;$("#app").hidden=false;render();save()}
function born(n){
  const city=P(CITY),ln=P(LN);
  S={name:n||P(FN)+" "+ln,age:0,hp:R(70,100),hap:R(70,100),int:R(25,85),look:R(25,90),money:0,job:null,deg:0,col:0,pension:0,jail:0,rec:0,assets:[],done:[],used:{},log:[],dead:0,
    rel:[{n:P(FN)+" "+ln,r:"Mother",a:R(22,38),c:R(60,95)},{n:P(FN)+" "+ln,r:"Father",a:R(24,42),c:R(55,95)}]};
  L(`You were born in ${city} as ${S.name}. Your parents are ${S.rel[0].n} and ${S.rel[1].n}.`);start()}

$("#go").onclick=()=>born($("#nm0").value.trim());
$("#age").onclick=ageUp;
$("#vb").textContent="v"+VER;$("#verI").textContent="Version "+VER+" - what's new";$("#vb").onclick=$("#verI").onclick=about;
document.querySelectorAll("nav button[data-t]").forEach(b=>b.onclick=()=>panel(b.dataset.t));
const sv=load();if(sv&&!sv.dead){$("#cont").hidden=false;$("#cont").onclick=()=>{S=sv;start()}}
</script>
